# ~/.config/alacritty/alacritty.toml

[general]
live_config_reload = true

[env]
TERM = "xterm-256color"

[window]
padding = { x = 8, y = 8 }
# decorations = "None"
opacity = 1.0
startup_mode = "Windowed"
title = "Alacritty"
dynamic_title = true

[scrolling]
history = 10000
multiplier = 3

[font]
normal = { family = "AdwaitaMono Nerd Font Mono", style = "Regular" }
bold   = { family = "AdwaitaMono Nerd Font Mono", style = "Bold" }
italic = { family = "AdwaitaMono Nerd Font Mono", style = "Italic" }
size   = 12.0

# Slight adjustments for Iosevka-based fonts which can feel narrow
[font.offset]
x = 0
y = 2          # adds a touch of line spacing, easier on the eyes long sessions

[font.glyph_offset]
x = 0
y = 0

[cursor]
style = { shape = "Block", blinking = "On" }
blink_interval = 500
unfocused_hollow = true

[terminal]
osc52 = "CopyPaste"    # allows Neovim to sync clipboard via OSC52 — important for your workflow

[keyboard]
bindings = [
  # Pass ctrl+shift+c/v through to tmux/nvim without conflict
  { key = "C", mods = "Control|Shift", action = "Copy" },
  { key = "V", mods = "Control|Shift", action = "Paste" },
]

# Colors — Gruvbox Dark
[colors.primary]
background = "#282828"
foreground = "#ebdbb2"

[colors.cursor]
text   = "#282828"
cursor = "#ebdbb2"

[colors.normal]
black   = "#282828"
red     = "#cc241d"
green   = "#98971a"
yellow  = "#d79921"
blue    = "#458588"
magenta = "#b16286"
cyan    = "#689d6a"
white   = "#a89984"

[colors.bright]
black   = "#928374"
red     = "#fb4934"
green   = "#b8bb26"
yellow  = "#fabd2f"
blue    = "#83a598"
magenta = "#d3869b"
cyan    = "#8ec07c"
white   = "#ebdbb2"
